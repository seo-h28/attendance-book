<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e6b3a">
  <!--
    보안 정책: 이 앱은 자기 자신의 파일만 불러오고, 어떤 서버로도 데이터를 보낼 수 없다.
    (connect-src 'none' = fetch/XHR/WebSocket 전송 금지, form-action 'none' = 폼 전송 금지)
    외부 스크립트·글꼴·이미지도 쓰지 않는다. 이 줄을 지우거나 완화하지 말 것.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>출석부</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>이 화면은 자바스크립트가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
